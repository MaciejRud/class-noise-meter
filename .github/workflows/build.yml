name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ad-hoc signature (mac.sign.identity "-" in package.json): no Apple Developer account,
      # the teacher opens it once via "Open Anyway"; fully unsigned arm64 apps are killed on launch
      - run: npx electron-builder --mac --universal --publish never
      # proof that the ad-hoc signature is there: unsigned arm64 apps die on launch, and no Mac is in the loop
      - name: verify signature
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/mac-universal/Cicho-metr.app"
          codesign -dv "dist/mac-universal/Cicho-metr.app" 2>&1 | grep -E '^(Identifier|Signature|TeamIdentifier)'
      - uses: actions/upload-artifact@v4
        with:
          name: cicho-metr-mac
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: cicho-metr-windows
          path: dist/*.exe
